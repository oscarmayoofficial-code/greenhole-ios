# Cloud macOS build for Green Hole (iOS) — you have no Mac, this builds the IPA
# for you on Codemagic's macOS machines and uploads it to App Store Connect.
#
# ONE-TIME SETUP (after you have the paid Apple Developer account):
#   1. Push this project (D:\ios\greenhole) to a GitHub/GitLab repo.
#   2. In Codemagic: add the app from that repo.
#   3. Codemagic > Teams > Integrations > App Store Connect: create an API key
#      integration and name it exactly  "AppStoreConnect"  (matches below).
#   4. Register the bundle id  com.oscar.greenhole  in App Store Connect and
#      create the app record there (name: Green Hole).
#   5. Push a commit — this workflow runs, signs, and uploads to TestFlight.
#
# No Mac and no local Xcode are ever needed; everything below runs in the cloud.

workflows:
  ios-release:
    name: Green Hole iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.oscar.greenhole
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.oscar.greenhole"
        APP_STORE_APPLE_ID: 6802589108  # Green Hole app record
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Flutter analyze
        script: flutter analyze
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight automatically. Flip submit_to_app_store to true
        # only when you're ready to push to actual App Store review.
        submit_to_testflight: true
        submit_to_app_store: false
